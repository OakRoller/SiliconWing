name: Something is broken
description: The card is not found, a game crashes or draws wrong, the Mac panics, or something else does not work.
title: "[Bug] <what happens>"
labels: [bug]
body:
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: MacBook Pro 14" M1 Pro, macOS 27.0.1
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Enclosure and card
      placeholder: Thunderbolt 3 enclosure (JHL7540), RTX 3070
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The VERSION file in the package folder.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it go wrong?
      options:
        - Installing (install.sh, CHECK=1)
        - Plugging in the card (not found, isr count stays 0)
        - Launching a game (usenv, NVMTLDevice NOT found)
        - In a game or app (crash, wrong image, slow)
        - The Mac panics or restarts
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did and what you see. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach the driver log (/tmp/nvmtl.log, $TMPDIR/nvmtl.log or your NVMTL_LOG_PATH) and, after a restart, the panic report from /Library/Logs/DiagnosticReports/.
  - type: input
    id: app
    attributes:
      label: App or game (if it is one)
      placeholder: name and version
