name: It works on my Mac
description: Tell us a Mac, enclosure and card that work - every new combination helps.
title: "[Works] <Mac> + <card>"
labels: [works]
body:
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Enclosure and card
    validations:
      required: true
  - type: textarea
    id: games
    attributes:
      label: What you ran, and how fast
      description: Games or apps, settings, frame rates - and the same on the built-in GPU if you measured it.
  - type: textarea
    id: notes
    attributes:
      label: Anything you had to do differently from the README
